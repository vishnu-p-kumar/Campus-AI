name: CampusAI CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campusai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campusai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
        working-directory: CampusAI-Codex-Starter
      - name: Run backend tests
        run: PYTHONPATH=backend pytest backend/tests -q
        working-directory: CampusAI-Codex-Starter
        env:
          CAMPUSAI_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/campusai_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: CampusAI-Codex-Starter/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API dependencies for browser tests
        run: python -m pip install -r backend/requirements.txt
        working-directory: CampusAI-Codex-Starter
      - name: Install frontend dependencies
        run: npm ci
        working-directory: CampusAI-Codex-Starter/frontend
      - name: Lint
        run: npm run lint
        working-directory: CampusAI-Codex-Starter/frontend
      - name: Build
        run: npm run build
        working-directory: CampusAI-Codex-Starter/frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: CampusAI-Codex-Starter/frontend
      - name: Run browser tests
        run: npm run test:e2e
        working-directory: CampusAI-Codex-Starter/frontend
