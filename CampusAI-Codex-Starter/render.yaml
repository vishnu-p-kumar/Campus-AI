services:
  - type: web
    name: campusai-api
    runtime: python
    rootDir: CampusAI-Codex-Starter
    buildCommand: python -m pip install -r backend/requirements.txt -r backend/requirements-ai.txt && python -m alembic -c backend/alembic.ini upgrade head
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENVIRONMENT
        value: production
      - key: DOCUMENT_INGESTION_MODE
        value: queued
      - key: DATABASE_URL
        fromDatabase:
          name: campusai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PASSWORD_RESET_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PLACEMENT_API_KEY
        sync: false
      - key: GEMINI_CHAT_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: campusai_document_chunks
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RERANKER_MODEL
        value: cross-encoder/ms-marco-MiniLM-L-6-v2
      - key: UPLOAD_DIRECTORY
        value: /var/data/campusai-uploads
      - key: UPLOAD_SCAN_REQUIRED
        value: "true"
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"
    disk:
      name: campusai-uploads
      mountPath: /var/data
      sizeGB: 2

  - type: worker
    name: campusai-ingestion-worker
    runtime: python
    rootDir: CampusAI-Codex-Starter
    buildCommand: python -m pip install -r backend/requirements.txt -r backend/requirements-ai.txt
    startCommand: cd backend && python -m app.ingestion_worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusai-db
          property: connectionString
      - key: DOCUMENT_INGESTION_MODE
        value: queued
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: campusai_document_chunks
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: UPLOAD_SCAN_REQUIRED
        value: "true"
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"

databases:
  - name: campusai-db
    databaseName: campusai
    user: campusai
    plan: basic-256mb
