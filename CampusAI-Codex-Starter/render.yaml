services:
  - type: web
    name: campusai-api
    runtime: python
    plan: free
    rootDir: CampusAI-Codex-Starter
    buildCommand: python -m pip install -r backend/requirements.txt
    startCommand: python -m alembic -c backend/alembic.ini upgrade head && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENVIRONMENT
        value: production
      - key: DOCUMENT_INGESTION_MODE
        value: inline
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PASSWORD_RESET_URL
        sync: false
      - key: FILE_UPLOADS_ENABLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_PLACEMENT_API_KEY
        sync: false
      - key: GEMINI_CHAT_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: UPLOAD_DIRECTORY
        value: /tmp/campusai-uploads
