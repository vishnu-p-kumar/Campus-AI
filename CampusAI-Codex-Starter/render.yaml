services:
  - type: web
    name: campusai-api
    runtime: python
    rootDir: .
    buildCommand: python -m pip install -r CampusAI-Codex-Starter/backend/requirements.txt -r CampusAI-Codex-Starter/backend/requirements-ai.txt -r placement-query-bot-deploy/requirements.txt && python -m alembic -c CampusAI-Codex-Starter/backend/alembic.ini upgrade head
    startCommand: uvicorn app.main:app --app-dir CampusAI-Codex-Starter/backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENVIRONMENT
        value: production
      - key: DOCUMENT_INGESTION_MODE
        value: queued
      - key: DATABASE_URL
        fromDatabase:
          name: campusai-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PASSWORD_RESET_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.1-flash-lite
      - key: GEMINI_CHAT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: JSONBIN_BIN_ID
        sync: false
      - key: JSONBIN_API_KEY
        sync: false
      - key: LOG_BIN_ID
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: campusai_document_chunks
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RERANKER_MODEL
        value: cross-encoder/ms-marco-MiniLM-L-6-v2
      - key: UPLOAD_DIRECTORY
        value: /var/data/campusai-uploads
      - key: UPLOAD_SCAN_REQUIRED
        value: "true"
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"
    disk:
      name: campusai-uploads
      mountPath: /var/data
      sizeGB: 2

  - type: worker
    name: campusai-ingestion-worker
    runtime: python
    rootDir: .
    buildCommand: python -m pip install -r CampusAI-Codex-Starter/backend/requirements.txt -r CampusAI-Codex-Starter/backend/requirements-ai.txt -r placement-query-bot-deploy/requirements.txt
    startCommand: cd CampusAI-Codex-Starter/backend && python -m app.ingestion_worker
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campusai-db
          property: connectionString
      - key: DOCUMENT_INGESTION_MODE
        value: queued
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: campusai_document_chunks
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: UPLOAD_SCAN_REQUIRED
        value: "true"
      - key: CLAMAV_HOST
        sync: false
      - key: CLAMAV_PORT
        value: "3310"

databases:
  - name: campusai-db
    databaseName: campusai
    user: campusai
    plan: basic-256mb
