services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusai
      POSTGRES_USER: campusai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - campusai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusai -d campusai"]
      interval: 5s
      timeout: 3s
      retries: 10
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - campusai_qdrant:/qdrant/storage
  clamav:
    image: clamav/clamav:stable
    profiles: ["security"]
    ports:
      - "127.0.0.1:3310:3310"

volumes:
  campusai_postgres:
  campusai_qdrant:
